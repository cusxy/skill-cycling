name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  format:
    name: agloom format --check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install agloom
        run: npm install -g agloom

      - name: Check formatting
        run: agloom format --check
